name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --experimental-strip-types --test test/pool.test.mjs test/thread.test.mjs test/model.test.mjs
      - name: Package contents
        run: npm pack --dry-run
